<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Порядок</title>
<meta name="theme-color" content="#0F231D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Порядок">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F231D'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23F2B705' stroke-width='8'/%3E%3Cpath d='M50 30 L50 50 L64 58' stroke='%235FD3BC' stroke-width='8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F231D'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23F2B705' stroke-width='8'/%3E%3Cpath d='M50 30 L50 50 L64 58' stroke='%235FD3BC' stroke-width='8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22%D0%9F%D0%BE%D1%80%D1%8F%D0%B4%D0%BE%D0%BA%22,%22short_name%22:%22%D0%9F%D0%BE%D1%80%D1%8F%D0%B4%D0%BE%D0%BA%22,%22display%22:%22standalone%22,%22background_color%22:%22%230F231D%22,%22theme_color%22:%22%230F231D%22,%22start_url%22:%22.%22}">
<style>
  :root{
    --bg:#0F231D;
    --surface:#16332B;
    --surface-2:#1D3E34;
    --line:#284A3F;
    --text:#EDF3F0;
    --muted:#8FB0A4;
    --amber:#F2B705;
    --mint:#5FD3BC;
    --coral:#E4572E;
    --lilac:#B79CED;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior-y:none;
    padding-top:env(safe-area-inset-top);
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:calc(70px + env(safe-area-inset-bottom));
  }
  header.top{
    padding:22px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  header.top h1{
    font-size:22px;
    margin:0;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  header.top .date{
    font-size:13px;
    color:var(--muted);
  }
  main{flex:1; padding:0 16px 24px;}
  section.view{display:none;}
  section.view.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:14px;
    margin:0 0 12px;
    color:var(--muted);
    font-weight:600;
  }

  /* stat row */
  .stats{display:flex; gap:10px; margin-bottom:14px;}
  .stat{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .stat .n{font-size:20px; font-weight:700;}
  .stat .l{font-size:11px; color:var(--muted); margin-top:2px;}

  /* forms */
  .form-row{display:flex; flex-direction:column; gap:10px; margin-bottom:10px;}
  input, select, textarea{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:12px 12px;
    border-radius:10px;
    font-size:15px;
    width:100%;
    font-family:inherit;
  }
  input::placeholder{color:var(--muted);}
  .two-col{display:flex; gap:10px;}
  .two-col > *{flex:1;}
  button.primary{
    background:var(--amber);
    color:#1a1400;
    border:none;
    padding:13px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    width:100%;
  }
  button.primary:active{opacity:.85;}
  .add-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:var(--amber);
    font-weight:600;
    font-size:14px;
    padding:10px;
    margin-bottom:10px;
  }

  /* list items */
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{border-bottom:none;}
  .chk{
    width:26px; height:26px; min-width:26px;
    border-radius:50%;
    border:2px solid var(--muted);
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
  }
  .chk.done{background:var(--mint); border-color:var(--mint); color:#0F231D;}
  .chk.mid{background:none; border-color:var(--amber); color:var(--amber);}
  .item .body{flex:1; min-width:0;}
  .item .title{font-size:15px; font-weight:600; line-height:1.3;}
  .item .title.strike{text-decoration:line-through; color:var(--muted);}
  .item .meta{font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:6px; flex-wrap:wrap;}
  .tag{
    display:inline-block;
    padding:1px 7px;
    border-radius:20px;
    background:var(--surface-2);
    font-size:11px;
  }
  .tag.high{color:var(--coral);}
  .tag.med{color:var(--amber);}
  .tag.low{color:var(--mint);}
  .del{
    color:var(--muted);
    font-size:18px;
    padding:4px 6px;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:24px 10px;
  }

  /* habits */
  .habit-row{padding:12px 4px; border-bottom:1px solid var(--line);}
  .habit-row:last-child{border-bottom:none;}
  .habit-top{display:flex; align-items:center; gap:12px;}
  .habit-name{flex:1; font-size:15px; font-weight:600;}
  .habit-pct{font-size:13px; color:var(--mint); font-weight:700; min-width:36px; text-align:right;}
  .bar-track{height:6px; background:var(--surface-2); border-radius:4px; margin-top:8px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--mint); border-radius:4px;}
  .week{display:flex; gap:5px; margin-top:10px;}
  .day-dot{
    flex:1;
    height:30px;
    border-radius:8px;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
    color:var(--muted);
    border:1px solid transparent;
  }
  .day-dot.today{border-color:var(--amber); color:var(--amber);}
  .day-dot.on{background:var(--mint); color:#0F231D; font-weight:700;}

  /* charts */
  .chart-wrap{display:flex; align-items:center; gap:16px;}
  .legend{flex:1; display:flex; flex-direction:column; gap:8px;}
  .legend-item{display:flex; align-items:center; gap:8px; font-size:12.5px;}
  .legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .legend-val{margin-left:auto; color:var(--muted);}

  /* tabbar */
  nav.tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:480px;
    margin:0 auto;
    background:rgba(22,51,43,.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    padding:10px 0 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:11px;
    font-family:inherit;
  }
  nav.tabbar button.active{color:var(--amber);}
  nav.tabbar svg{width:22px; height:22px;}

  select{-webkit-appearance:none; appearance:none;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1 id="viewTitle">Задачи</h1>
    <div class="date" id="todayLabel"></div>
  </header>

  <main>
    <!-- TASKS -->
    <section class="view active" id="view-tasks">
      <div class="stats">
        <div class="stat"><div class="n" id="t-total">0</div><div class="l">всего</div></div>
        <div class="stat"><div class="n" id="t-done">0</div><div class="l">готово</div></div>
        <div class="stat"><div class="n" id="t-pct">0%</div><div class="l">прогресс</div></div>
      </div>

      <div class="card" id="t-chart-card">
        <h2>Статусы задач</h2>
        <div class="chart-wrap">
          <div id="t-donut"></div>
          <div class="legend" id="t-legend"></div>
        </div>
      </div>

      <div class="add-toggle" onclick="toggleForm('t-form')">+ Добавить задачу</div>
      <div class="card" id="t-form" style="display:none">
        <div class="form-row">
          <input id="t-input-text" placeholder="Что нужно сделать?">
          <div class="two-col">
            <input id="t-input-cat" placeholder="Категория">
            <select id="t-input-prio">
              <option value="Низкий">Низкий приоритет</option>
              <option value="Средний" selected>Средний приоритет</option>
              <option value="Высокий">Высокий приоритет</option>
            </select>
          </div>
          <input id="t-input-due" type="date">
          <button class="primary" onclick="addTask()">Добавить</button>
        </div>
      </div>

      <div class="card" id="t-list"></div>
    </section>

    <!-- HABITS -->
    <section class="view" id="view-habits">
      <div class="card">
        <h2>Последние 7 дней</h2>
        <div class="chart-wrap">
          <div id="h-bars" style="flex:1"></div>
        </div>
      </div>

      <div class="add-toggle" onclick="toggleForm('h-form')">+ Добавить привычку</div>
      <div class="card" id="h-form" style="display:none">
        <div class="form-row">
          <input id="h-input-name" placeholder="Название привычки">
          <button class="primary" onclick="addHabit()">Добавить</button>
        </div>
      </div>

      <div class="card" id="h-list"></div>
    </section>

    <!-- FINANCE -->
    <section class="view" id="view-fin">
      <div class="stats">
        <div class="stat"><div class="n" id="f-income" style="color:var(--mint)">0</div><div class="l">доходы</div></div>
        <div class="stat"><div class="n" id="f-expense" style="color:var(--coral)">0</div><div class="l">расходы</div></div>
        <div class="stat"><div class="n" id="f-balance">0</div><div class="l">баланс</div></div>
      </div>

      <div class="card">
        <h2>Расходы по категориям</h2>
        <div class="chart-wrap">
          <div id="f-donut"></div>
          <div class="legend" id="f-legend"></div>
        </div>
      </div>

      <div class="add-toggle" onclick="toggleForm('f-form')">+ Добавить операцию</div>
      <div class="card" id="f-form" style="display:none">
        <div class="form-row">
          <div class="two-col">
            <input id="f-input-date" type="date">
            <select id="f-input-type">
              <option value="Расход">Расход</option>
              <option value="Доход">Доход</option>
            </select>
          </div>
          <div class="two-col">
            <input id="f-input-cat" placeholder="Категория">
            <input id="f-input-amt" type="number" inputmode="decimal" placeholder="Сумма">
          </div>
          <input id="f-input-note" placeholder="Комментарий (необязательно)">
          <button class="primary" onclick="addTx()">Добавить</button>
        </div>
      </div>

      <div class="card" id="f-list"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="active" data-view="tasks" onclick="switchView('tasks')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Задачи
    </button>
    <button data-view="habits" onclick="switchView('habits')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Привычки
    </button>
    <button data-view="fin" onclick="switchView('fin')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      Финансы
    </button>
  </nav>
</div>

<script>
/* ---------- storage ---------- */
const KEY = 'poryadok_v1';
const load = () => {
  try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; }
};
const seed = {
  tasks: [
    {id:1, text:'Подготовить отчёт по продажам', cat:'Работа', prio:'Высокий', due:'', status:'progress'}
  ],
  habits: [
    {id:1, name:'Пить 2 л воды', dates:[]},
    {id:2, name:'Читать 20 минут', dates:[]},
    {id:3, name:'Тренировка', dates:[]}
  ],
  tx: [
    {id:1, date: todayISO(), type:'Доход', cat:'Зарплата', amt:45000, note:'Аванс'},
    {id:2, date: todayISO(), type:'Расход', cat:'Продукты', amt:3200, note:'Супермаркет'}
  ]
};
function todayISO(){ return new Date().toISOString().slice(0,10); }

let state = load() || seed;
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

/* ---------- nav ---------- */
const titles = {tasks:'Задачи', habits:'Привычки', fin:'Финансы'};
function switchView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('viewTitle').textContent = titles[v];
}
function toggleForm(id){
  const el = document.getElementById(id);
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}

/* ---------- charts (vanilla SVG) ---------- */
function donut(data, size=104){
  // data: [{label, value, color}]
  const total = data.reduce((s,d)=>s+d.value,0);
  const r = size/2 - 10, cx=size/2, cy=size/2, circ = 2*Math.PI*r;
  let offset = 0;
  let arcs = '';
  if(total <= 0){
    arcs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#284A3F" stroke-width="14"/>`;
  } else {
    data.forEach(d=>{
      if(d.value<=0) return;
      const frac = d.value/total;
      const len = frac*circ;
      arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="14"
        stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" stroke-linecap="butt" transform="rotate(-90 ${cx} ${cy})"/>`;
      offset += len;
    });
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}
    <text x="${cx}" y="${cy+5}" text-anchor="middle" fill="#EDF3F0" font-size="15" font-weight="700" font-family="inherit">${total>0? total.toLocaleString('ru-RU'):'—'}</text>
  </svg>`;
}
function legendHTML(data){
  const total = data.reduce((s,d)=>s+d.value,0);
  return data.map(d=>{
    const pct = total>0 ? Math.round(d.value/total*100) : 0;
    return `<div class="legend-item"><span class="legend-dot" style="background:${d.color}"></span>${d.label}<span class="legend-val">${pct}%</span></div>`;
  }).join('');
}
function barsHTML(values, labels, color){
  const max = Math.max(1, ...values);
  return `<div style="display:flex; align-items:flex-end; gap:8px; height:90px;">` +
    values.map((v,i)=>`
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;">
        <div style="width:100%; max-width:26px; height:${Math.max(4, v/max*64)}px; background:${color}; border-radius:6px 6px 3px 3px;"></div>
        <div style="font-size:10px; color:var(--muted)">${labels[i]}</div>
      </div>`).join('') + `</div>`;
}

/* ---------- TASKS ---------- */
const PRIO_CLASS = {'Высокий':'high','Средний':'med','Низкий':'low'};
function addTask(){
  const text = document.getElementById('t-input-text').value.trim();
  if(!text) return;
  const cat = document.getElementById('t-input-cat').value.trim() || 'Общее';
  const prio = document.getElementById('t-input-prio').value;
  const due = document.getElementById('t-input-due').value;
  state.tasks.push({id:Date.now(), text, cat, prio, due, status:'todo'});
  document.getElementById('t-input-text').value='';
  document.getElementById('t-input-cat').value='';
  document.getElementById('t-input-due').value='';
  save(); renderTasks();
}
function cycleStatus(id){
  const t = state.tasks.find(x=>x.id===id);
  t.status = t.status==='todo' ? 'progress' : t.status==='progress' ? 'done' : 'todo';
  save(); renderTasks();
}
function delTask(id){ state.tasks = state.tasks.filter(x=>x.id!==id); save(); renderTasks(); }

function renderTasks(){
  const total = state.tasks.length;
  const done = state.tasks.filter(t=>t.status==='done').length;
  const progress = state.tasks.filter(t=>t.status==='progress').length;
  const todo = total-done-progress;
  document.getElementById('t-total').textContent = total;
  document.getElementById('t-done').textContent = done;
  document.getElementById('t-pct').textContent = total? Math.round(done/total*100)+'%' : '0%';

  const data = [
    {label:'Готово', value:done, color:'#5FD3BC'},
    {label:'В процессе', value:progress, color:'#F2B705'},
    {label:'Не начато', value:todo, color:'#E4572E'},
  ];
  document.getElementById('t-donut').innerHTML = donut(data);
  document.getElementById('t-legend').innerHTML = legendHTML(data);

  const list = document.getElementById('t-list');
  if(!state.tasks.length){ list.innerHTML = '<div class="empty">Пока нет задач — добавь первую</div>'; return; }
  list.innerHTML = state.tasks.map(t=>{
    const chkClass = t.status==='done'?'done':t.status==='progress'?'mid':'';
    const chkMark = t.status==='done'?'✓':t.status==='progress'?'…':'';
    return `<div class="item">
      <div class="chk ${chkClass}" onclick="cycleStatus(${t.id})">${chkMark}</div>
      <div class="body">
        <div class="title ${t.status==='done'?'strike':''}">${escapeHTML(t.text)}</div>
        <div class="meta">
          <span class="tag ${PRIO_CLASS[t.prio]||''}">${t.prio}</span>
          <span class="tag">${escapeHTML(t.cat)}</span>
          ${t.due? `<span class="tag">до ${t.due}</span>`:''}
        </div>
      </div>
      <div class="del" onclick="delTask(${t.id})">✕</div>
    </div>`;
  }).join('');
}

/* ---------- HABITS ---------- */
function addHabit(){
  const name = document.getElementById('h-input-name').value.trim();
  if(!name) return;
  state.habits.push({id:Date.now(), name, dates:[]});
  document.getElementById('h-input-name').value='';
  save(); renderHabits();
}
function delHabit(id){ state.habits = state.habits.filter(h=>h.id!==id); save(); renderHabits(); }
function toggleHabitDay(id, iso){
  const h = state.habits.find(x=>x.id===id);
  const i = h.dates.indexOf(iso);
  if(i>=0) h.dates.splice(i,1); else h.dates.push(iso);
  save(); renderHabits();
}
function last7(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}
function monthDays(){
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
}
function renderHabits(){
  const days = last7();
  const dayLabels = days.map(d=>['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(d+'T00:00:00').getDay()]);
  const totals = days.map(d => state.habits.filter(h=>h.dates.includes(d)).length);
  document.getElementById('h-bars').innerHTML = barsHTML(totals, dayLabels, '#5FD3BC');

  const list = document.getElementById('h-list');
  if(!state.habits.length){ list.innerHTML = '<div class="empty">Пока нет привычек — добавь первую</div>'; return; }
  const mDays = monthDays();
  const todayIso = todayISO();
  list.innerHTML = state.habits.map(h=>{
    const doneThisMonth = h.dates.filter(d=>d.slice(0,7)===todayIso.slice(0,7)).length;
    const pct = Math.min(100, Math.round(doneThisMonth/mDays*100));
    const weekDots = days.map(d=>{
      const on = h.dates.includes(d);
      const isToday = d===todayIso;
      return `<div class="day-dot ${on?'on':''} ${isToday?'today':''}" onclick="toggleHabitDay(${h.id},'${d}')">${on?'✓':''}</div>`;
    }).join('');
    return `<div class="habit-row">
      <div class="habit-top">
        <div class="habit-name">${escapeHTML(h.name)}</div>
        <div class="habit-pct">${pct}%</div>
        <div class="del" onclick="delHabit(${h.id})">✕</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="week">${weekDots}</div>
    </div>`;
  }).join('');
}

/* ---------- FINANCE ---------- */
const FIN_COLORS = ['#F2B705','#5FD3BC','#B79CED','#E4572E','#6FA8DC','#F29E4C'];
function addTx(){
  const date = document.getElementById('f-input-date').value || todayISO();
  const type = document.getElementById('f-input-type').value;
  const cat = document.getElementById('f-input-cat').value.trim() || 'Прочее';
  const amt = parseFloat(document.getElementById('f-input-amt').value);
  if(!amt || amt<=0) return;
  const note = document.getElementById('f-input-note').value.trim();
  state.tx.push({id:Date.now(), date, type, cat, amt, note});
  document.getElementById('f-input-cat').value='';
  document.getElementById('f-input-amt').value='';
  document.getElementById('f-input-note').value='';
  save(); renderFin();
}
function delTx(id){ state.tx = state.tx.filter(x=>x.id!==id); save(); renderFin(); }

function renderFin(){
  const income = state.tx.filter(t=>t.type==='Доход').reduce((s,t)=>s+t.amt,0);
  const expense = state.tx.filter(t=>t.type==='Расход').reduce((s,t)=>s+t.amt,0);
  document.getElementById('f-income').textContent = income.toLocaleString('ru-RU');
  document.getElementById('f-expense').textContent = expense.toLocaleString('ru-RU');
  document.getElementById('f-balance').textContent = (income-expense).toLocaleString('ru-RU');

  const byCat = {};
  state.tx.filter(t=>t.type==='Расход').forEach(t=>{ byCat[t.cat] = (byCat[t.cat]||0)+t.amt; });
  const catData = Object.entries(byCat)
    .sort((a,b)=>b[1]-a[1])
    .map(([label,value],i)=>({label, value, color: FIN_COLORS[i%FIN_COLORS.length]}));
  document.getElementById('f-donut').innerHTML = donut(catData);
  document.getElementById('f-legend').innerHTML = catData.length ? legendHTML(catData) : '<div class="empty" style="padding:0">Нет расходов</div>';

  const list = document.getElementById('f-list');
  if(!state.tx.length){ list.innerHTML = '<div class="empty">Пока нет операций</div>'; return; }
  const sorted = [...state.tx].sort((a,b)=> b.date.localeCompare(a.date));
  list.innerHTML = sorted.map(t=>`
    <div class="item">
      <div class="chk" style="border-color:${t.type==='Доход'?'#5FD3BC':'#E4572E'}; color:${t.type==='Доход'?'#5FD3BC':'#E4572E'}; font-size:16px;">${t.type==='Доход'?'+':'−'}</div>
      <div class="body">
        <div class="title">${escapeHTML(t.cat)} ${t.note?'· '+escapeHTML(t.note):''}</div>
        <div class="meta"><span class="tag">${t.date}</span></div>
      </div>
      <div class="body" style="flex:none; text-align:right;">
        <div class="title" style="color:${t.type==='Доход'?'#5FD3BC':'#E4572E'}">${t.type==='Доход'?'+':'−'}${t.amt.toLocaleString('ru-RU')}</div>
      </div>
      <div class="del" onclick="delTx(${t.id})">✕</div>
    </div>`).join('');
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- init ---------- */
document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
document.getElementById('f-input-date').value = todayISO();
renderTasks();
renderHabits();
renderFin();
</script>
